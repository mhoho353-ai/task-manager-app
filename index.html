<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام السحابي مع المصادقة</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; font-size: 16px; }
        input { background: #334155; color: white; }
        button { background: #6366f1; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #4f46e5; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .task-item { background: #334155; padding: 10px; margin-top: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم تسجيل الدخول (يظهر للمستخدم غير المسجل) -->
        <div id="auth-container">
            <h2 style="text-align: center;">تسجيل الدخول للنظام 🔐</h2>
            <input type="email" id="auth-email" placeholder="البريد الإلكتروني">
            <input type="password" id="auth-password" placeholder="كلمة المرور">
            <div style="display: flex; gap: 10px;">
                <button onclick="handleLogin()">دخول</button>
                <button onclick="handleSignup()" class="btn-success">حساب جديد</button>
            </div>
        </div>

        <!-- تطبيق المهام الأساسي (مخفي ولا يظهر إلا بعد تسجيل الدخول) -->
        <div id="app-container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #475569; padding-bottom: 10px;">
                <span id="user-email-display" style="font-size: 14px; color: #cbd5e1;"></span>
                <button onclick="handleLogout()" class="btn-danger" style="width: auto; padding: 6px 12px; margin: 0;">تسجيل خروج</button>
            </div>

            <h3>إضافة مهمة سحابية جديدة 📋</h3>
            <input type="text" id="task-input" placeholder="اكتب عنوان المهمة...">
            <button onclick="addTask()" class="btn-success">حفظ المهمة</button>

            <h3 style="margin-top: 20px;">المهام السحابية:</h3>
            <div id="tasks-list">جاري تحميل المهام...</div>
        </div>
    </div>

    <script>
        // ⚠️ استبدل البيانات التالية ببيانات مشروعك الحقيقية من Supabase
        const SUPABASE_URL = 'https://nndcnilwosxpqbodfpcj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5uZGNuaWx3b3N4cHFib2RmcGNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNzYwOTMsImV4cCI6MjEwNzk1MjA5M30.oDzj6K6Nz8FVIYolYJd5ExuJD4TV4ovVQQrIJ6M3L1s';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. إنشاء حساب جديد
        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('خطأ في التسجيل: ' + error.message);
            } else {
                alert('تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.');
            }
        }

        // 2. تسجيل الدخول
        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('فشل الدخول: ' + error.message);
            } else {
                checkUserSession();
            }
        }

        // 3. تسجيل الخروج
        async function handleLogout() {
            await supabase.auth.signOut();
            location.reload();
        }

        // 4. التحقق من الجلسة وتغيير الواجهة
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('user-email-display').innerText = session.user.email;
                loadTasks();
            } else {
                document.getElementById('auth-container').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
            }
        }

        // 5. جلب المهام من السحابة
        async function loadTasks() {
            const { data, error } = await supabase.from('tasks').select('*').order('id', { ascending: false });
            const listDiv = document.getElementById('tasks-list');
            
            if (error) {
                listDiv.innerHTML = 'خطأ في جلب المهام: ' + error.message;
                return;
            }

            if (data.length === 0) {
                listDiv.innerHTML = '<p style="color: #94a3b8; text-align: center;">لا توجد مهام سحابية حالياً.</p>';
                return;
            }

            listDiv.innerHTML = '';
            data.forEach(task => {
                listDiv.innerHTML += `
                    <div class="task-item">
                        <span>${task.text}</span>
                        <button onclick="deleteTask(${task.id})" class="btn-danger" style="width: auto; padding: 4px 8px; margin:0; font-size: 12px;">حذف</button>
                    </div>
                `;
            });
        }

        // 6. إضافة مهمة جديدة للسحابة
        async function addTask() {
            const textInput = document.getElementById('task-input');
            const text = textInput.value.trim();
            if (!text) return alert('الرجاء كتابة نص المهمة!');

            // جلب المستخدم الحالي لإرفاق الـ ID الخاص به مع المهمة مستقبلاً
            const { data: { session } } = await supabase.auth.getSession();

            const { error } = await supabase.from('tasks').insert([{ text: text }]);
            
            if (error) {
                alert('فشل حفظ المهمة في السحابة: ' + error.message);
            } else {
                textInput.value = '';
                loadTasks();
            }
        }

        // 7. حذف مهمة
        async function deleteTask(id) {
            const { error } = await supabase.from('tasks').delete().eq('id', id);
            if (error) {
                alert('خطأ في الحذف: ' + error.message);
            } else {
                loadTasks();
            }
        }

        // فحص الجلسة فور فتح الصفحة
        checkUserSession();
    </script>
</body>
</html>
