<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام والمشاريع الشخصية الذكي</title>
    <meta name="description" content="تطبيق ويب متكامل لإدارة مهامك اليومية وتنظيم مشاريعك مع الحفظ التلقائي محلياً أونلاين مجاناً.">
    
    <!-- بيانات السيو المهيكلة (Schema Markup) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "مدير المهام الشخصية",
      "operatingSystem": "All",
      "applicationCategory": "ProductivityApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "تطبيق ويب لتنظيم وإدارة المهام مع حفظ محلي."
    }
    </script>

    <!-- تحميل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- الهيدر -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 text-center">
        <h1 class="text-2xl font-bold text-indigo-400">مدير المهام والمشاريع 📋</h1>
        <p class="text-xs text-slate-400 mt-1">نظم يومك، تتبع إنجازاتك، وحافظ على مهامك محفوظة بأمان تام</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-xl mx-auto p-4 sm:p-6 w-full flex-grow space-y-6">
        
        <!-- صندوق إضافة مهمة جديدة -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3 shadow-lg">
            <h2 class="font-bold text-sm text-indigo-300">إضافة مهمة جديدة</h2>
            <div class="flex flex-col gap-2">
                <input type="text" id="taskInput" placeholder="اكتب عنوان المهمة أو المشروع..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addTask()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl hover:bg-indigo-500 transition text-sm shadow-md">
                    إضافة للقائمة ➕
                </button>
            </div>
        </div>

        <!-- قائمة المهام -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg space-y-4">
            <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                <h3 class="font-bold text-sm text-slate-300">قائمة المهام الحالية</h3>
                <span id="taskCount" class="text-xs bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-full font-bold">0 مهمة</span>
            </div>

            <div id="taskList" class="space-y-2.5 max-h-80 overflow-y-auto">
                <!-- ستظهر المهام هنا برمجياً -->
                <p id="emptyMsg" class="text-center text-xs text-slate-500 py-6">لا توجد مهام مضافة حالياً. أضف مهمتك الأولى بالأعلى!</p>
            </div>
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
        البيانات تُحفظ تلقائياً في ذاكرة متصفحك المحلي (LocalStorage).
    </footer>

    <!-- سكريبت إدارة المهام والتخزين المحلي -->
    <script>
        let tasks = [];

        // استرجاع المهام عند تحميل الصفحة
        window.onload = function() {
            const savedTasks = localStorage.getItem('my_personal_tasks');
            if (savedTasks) {
                tasks = JSON.parse(savedTasks);
                renderTasks();
            }
        };

        function saveAndRender() {
            localStorage.setItem('my_personal_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            if (!text) {
                alert('الرجاء كتابة تفاصيل المهمة أولاً!');
                return;
            }

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            input.value = '';
            saveAndRender();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    return { ...task, completed: !task.completed };
                }
                return task;
            });
            saveAndRender();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const taskCount = document.getElementById('taskCount');
            const emptyMsg = document.getElementById('emptyMsg');

            taskList.innerHTML = '';
            taskCount.textContent = `${tasks.length} مهمة`;

            if (tasks.length === 0) {
                taskList.innerHTML = '<p class="text-center text-xs text-slate-500 py-6">لا توجد مهام مضافة حالياً. أضف مهمتك الأولى بالأعلى!</p>';
                return;
            }

            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `p-3 bg-slate-900 border border-slate-700 rounded-xl flex justify-between items-center transition ${task.completed ? 'opacity-50' : ''}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})" class="w-4 h-4 accent-indigo-500 cursor-pointer">
                        <span class="text-sm text-slate-200 truncate ${task.completed ? 'line-through text-slate-500' : ''}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded-lg transition">حذف 🗑️</button>
                `;
                taskList.appendChild(div);
            });
        }
    </script>
</body>
</html>
